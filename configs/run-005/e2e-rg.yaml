schema_version: surf-rag/pipeline/v1
experiment_id: rg-005
seed: 42

paths:
    data_base: data
    benchmark_base: data/benchmarks
    router_base: data/orchestrator
    benchmark_name: surf-bench
    benchmark_id: main
    router_id: ndcg@10
    router_architecture_id: rg

model_setup:
    embedding_model: all-MiniLM-L6-v2

retrieval:
    # taken from the graph rag grid search tuning
    graph_ppr_alpha: 0.9
    graph_transition_mode: support
    graph_seed_softmax_temperature: 0.1
    graph_entity_chunk_edge_weight: 0.9

generation:
    model: gpt-4o-mini
    prompt_file: prompts/generator.txt
    max_tokens: 512
    temperature: 0.0

router:
    dataset:
        embedding_provider: openai
        embedding_model: text-embedding-3-large
        openai_embedding_dimensions: 256
        embedding_cache_mode: auto
        embedding_cache_id: "002"

e2e:
    run_id: "005"
    router_input_mode: embedding
    router_task_type: regression
    policy: learned-soft
    dry_run: false
    reranker: none
    fusion_keep_k: 10
    rerank_top_k: 10
    branch_top_k: 25
    latency_warmup_questions: 50
    branch_cache:
        mode: router_oracle
        strict_manifest: true

secrets:
    openai_api_key_env: OPENAI_API_KEY
